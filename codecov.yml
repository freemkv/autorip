coverage:
  status:
    project:
      default:
        # Autorip is a release candidate mid-QA. The excluded files below are
        # the live-drive / live-mux orchestration that hardcodes physical
        # libfreemkv sessions or spawns worker threads and cannot run in CI
        # (rip_disc, the mux highway), plus the privileged bootstrap and
        # tracing init. `target` is the honest measured floor over the
        # remaining unit-tested surface; `informational` keeps this a signal,
        # never a merge blocker.
        target: 82%
        threshold: 1%
        informational: true
    patch:
      default:
        informational: true

comment: false

# Report paths are prefixed with the crate directory (e.g. `autorip/src/...`),
# so bare globs like `tests` or `src/main.rs` never match. Every ignore MUST be
# anchored with `**/` so it matches regardless of the leading path segment.
ignore:
  - "**/tests"
  - "**/tests/**"
  - "**/target"
  # Privileged bootstrap glue: root/mount/chown/setup that only runs as PID-1
  # inside the container and can't be exercised from unit tests.
  - "**/src/main.rs"
  # tracing/subscriber init — process-global side effects, no testable logic.
  - "**/src/observe.rs"
  # Live-drive orchestration: hardcodes a physical libfreemkv::Drive session,
  # unreachable in CI. Lifted here verbatim from mod.rs precisely so it can be
  # excluded without hiding the tested helpers that stayed in mod.rs.
  - "**/src/ripper/rip.rs"
  # Live-mux "highway": spawn_mux_worker + the producer/consumer thread split
  # drive a real libfreemkv mux session; the pure helpers here (outcome
  # mapping, queue building) ARE unit-tested, but the thread orchestration
  # itself only runs against a live mux and can't be exercised in CI.
  - "**/src/ripper/mux.rs"
