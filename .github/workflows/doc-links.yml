name: doc-links

# Broken intra-doc links fail the build. autorip is frozen, so it documents
# against the pinned sibling commits (.github/scripts/frozen-siblings.sh).
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  doc-links:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: autorip
      - name: Check out the pinned siblings (autorip is frozen)
        run: bash autorip/.github/scripts/frozen-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo doc (deny broken intra-doc links)
        working-directory: autorip
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        run: cargo doc --no-deps --document-private-items --lib --bins
