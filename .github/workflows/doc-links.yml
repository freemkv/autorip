name: doc-links

# Thin caller → the canonical reusable doc-links gate in freemkv/.github.
# autorip path-deps four freemkv crates, so the reusable checks out the sibling
# tips under test (incl. freemkv-unlock, reached as libfreemkv's path dep) and
# writes the [patch.crates-io] redirect; it resolves the toolchain from
# rust-version instead of a hardcoded pin.
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  doc-links:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    uses: freemkv/.github/.github/workflows/guard-doclinks.yml@v1
    with:
      self: autorip
      checkout: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n freemkv-unlock
      patch: libfreemkv freemkv-keysources freemkv-engine freemkv-i18n
