name: CI

on:
  push:
    # dev -> qa -> main. `dev` is where work lands and is meant to be pushed
    # to often: these are the FAST checks, so a mistake surfaces in minutes.
    # `qa` is the release candidate — it runs these too, plus the expensive
    # suite in qa.yml. `main` only ever moves at release time, to a tagged
    # commit that was already green on qa.
    branches: [main, dev, qa]
  pull_request:

# WHY THE SIBLING CHECKOUTS — this is NOT a monorepo.
#
# The committed Cargo.toml resolves every freemkv crate from a git TAG, and one
# of those tags (freemkv-engine v1.6.0) DOES NOT EXIST — release.sh creates it.
# So every job here failed at dependency resolution with "failed to find tag
# v1.6.0" before compiling a line. Even once that tag exists, pinning it means
# CI validates this branch against the last release of the libraries rather than
# their dev tips, so a change spanning repos cannot be verified until the tags
# are cut — the worst moment to find a build error.
#
# The fix mirrors the developer's local layout. Every repo is checked out into a
# subdirectory of $GITHUB_WORKSPACE, reproducing ~/Developer/freemkv/*, and a
# generated .cargo/config.toml redirects the git-tag patches at those paths.
# Config-level [patch.crates-io] wins over the manifest one — the same mechanism
# local development already uses (see the note in Cargo.toml).
#
# Subdirectories rather than `../libfreemkv` because actions/checkout refuses
# any `path:` outside $GITHUB_WORKSPACE, and the workspace IS the repo dir.
# Repos stay separate, tags stay separate, the release cascade is untouched.
#
# freemkv-unlock gets a checkout but no patch entry: it is reached as
# libfreemkv's path dep (../freemkv-unlock), which resolves to the workspace
# root under this layout.
#
# `--locked` is not used. The committed Cargo.lock resolves the freemkv crates
# as path packages and carries [[patch.unused]] entries — artifacts of whichever
# local cargo config last wrote it, describing a developer's machine rather than
# a release. release.sh regenerates it with the real tags at ship time, which is
# where the pin has to hold.
#
# OS COVERAGE. autorip rips discs through /dev/sg*, so Linux is what it RUNS on
# — but release.yml ships four targets: x86_64/aarch64 musl, aarch64-apple-darwin
# and x86_64-pc-windows-msvc. CI compiled only Linux-gnu, so three shipped
# targets were first built by the release workflow, after the version bump and
# the tag push. An old comment here claimed "freemkv CLI covers cross-platform";
# it does not — autorip has its own web UI, scheduler and job store, none of
# which the CLI compiles.
jobs:
  # CI owns the changelog: main may never carry a released version without a
  # CHANGELOG.md entry for it. The release orchestrator dates an existing
  # `## [X.Y.Z]` heading — it does NOT invent one — so a version bump that
  # forgot its changelog entry must fail here rather than ship a blank release.
  # Hard-fails on main (and PRs targeting main); warns elsewhere so an
  # in-progress dev/qa branch whose entry isn't written yet is not blocked.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require a CHANGELOG entry for the crate version on main
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has an entry for ${version}."
            exit 0
          fi
          msg="CHANGELOG.md has no '## [${version}]' entry"
          if [ "${GITHUB_REF_NAME:-}" = "main" ] || [ "${GITHUB_BASE_REF:-}" = "main" ]; then
            echo "::error::${msg} — main requires a changelog entry for the released version."
            exit 1
          fi
          echo "::warning::${msg} (allowed on ${GITHUB_REF_NAME:-unknown}; required before it can reach main)."

  # --all-targets so the test code is linted too, not just the binary.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: autorip
      - uses: actions/checkout@v5
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-engine
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-engine
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-i18n
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-i18n
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: autorip
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: autorip
      - run: cargo fmt --check
        working-directory: autorip
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: autorip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: autorip
      - uses: actions/checkout@v5
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-engine
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-engine
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-i18n
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-i18n
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: autorip
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: autorip
      - run: cargo test --tests
        working-directory: autorip

  # Coverage — additive, NON-REQUIRED. Mirrors the `test` job's sibling
  # checkouts and generated .cargo/config.toml so the workspace resolves the
  # freemkv crates from their dev tips exactly as the other jobs do, then runs
  # cargo-llvm-cov and uploads to Codecov tokenless (public repo). `--locked`
  # is intentionally omitted for the same reason the rest of this file omits it
  # (see the header note): the committed Cargo.lock resolves the freemkv crates
  # as path packages and cannot be satisfied with --locked under this layout.
  # No `needs:`/aggregator wires this job into a required gate, and Codecov is
  # configured informational-only (see codecov.yml), so it never blocks a merge
  # or the release.sh CI gate.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: autorip
      - uses: actions/checkout@v5
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-engine
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-engine
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-i18n
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-i18n
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: autorip
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: autorip
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage (lcov)
        working-directory: autorip
        run: cargo llvm-cov --workspace --ignore-run-fail --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: autorip/lcov.info
          slug: freemkv/autorip
          fail_ci_if_error: false

  # The shipped Linux artifact — and the GHCR image — is a static musl release
  # build, not the gnu dev build the jobs above produce. Static linking is
  # exactly where a new C-linking dependency breaks, and nothing else here
  # compiles that target.
  release-build-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: autorip
      - uses: actions/checkout@v5
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-engine
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-engine
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-i18n
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-i18n
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: autorip
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: autorip
      - name: Install musl cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
        working-directory: autorip

  # aarch64-apple-darwin is a SHIPPED target (release.yml builds it), and no
  # job compiled it until now. Build the tests rather than `cargo check` —
  # check skips codegen and never compiles test-only code.
  check-macos:
    # dev is the FAST lane: this job still runs, but on the release-candidate
    # branches rather than on every push to dev. Nothing is deleted and no
    # platform stops being checked before a release -- qa.yml independently
    # covers macOS and Windows, and the jobs unique to this file (the Intel
    # macOS build, the Windows release build) run here on qa and main. A push
    # to dev is meant to be cheap and frequent; waiting on three runner pools
    # to agree is what a release candidate is for.
    #
    # `if` SKIPS the job (it does not queue). A queued job would be far worse
    # than a slow one: release.sh's CI gate refuses while any run for the
    # commit is still in progress, so a never-scheduled job blocks releases
    # silently -- see the note on real-media in qa.yml.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: autorip
      - uses: actions/checkout@v5
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-engine
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-engine
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-i18n
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-i18n
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: autorip
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: autorip
      - run: cargo build --tests
        working-directory: autorip
      # aarch64-apple-darwin is a SHIPPED target and this is the only job that
      # RUNS the suite on it: release.yml's macOS matrix entry is build-only,
      # and qa.yml's macOS run is release-mode on the qa branch. Building the
      # test binaries and never executing them left every macOS-specific
      # behaviour (path handling, the fs metadata the mover stats, thread
      # timing) unchecked in debug on any branch — the same gap the Windows
      # job below was added to close.
      - name: Run tests
        working-directory: autorip
        run: cargo test --tests

  # x86_64-pc-windows-msvc is a SHIPPED target too. This is the only job that
  # compiles autorip's `#[cfg(windows)]` paths at all, so without it a broken
  # Windows build surfaces during the release, after the tag is pushed.
  check-windows:
    # dev is the FAST lane: this job still runs, but on the release-candidate
    # branches rather than on every push to dev. Nothing is deleted and no
    # platform stops being checked before a release -- qa.yml independently
    # covers macOS and Windows, and the jobs unique to this file (the Intel
    # macOS build, the Windows release build) run here on qa and main. A push
    # to dev is meant to be cheap and frequent; waiting on three runner pools
    # to agree is what a release candidate is for.
    #
    # `if` SKIPS the job (it does not queue). A queued job would be far worse
    # than a slow one: release.sh's CI gate refuses while any run for the
    # commit is still in progress, so a never-scheduled job blocks releases
    # silently -- see the note on real-media in qa.yml.
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: autorip
      - uses: actions/checkout@v5
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-engine
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-engine
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-i18n
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-i18n
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: autorip
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: autorip
      - run: cargo build --tests
        working-directory: autorip
      # Windows is a SHIPPED target, and this is the only runner that executes
      # the suite there. It went in reporting-only with five known failures —
      # four POSIX-path assertions and a CRLF-sensitive source match — and is a
      # real gate now that those are fixed, so the next one cannot creep in.
      - name: Run tests
        working-directory: autorip
        run: cargo test --tests
